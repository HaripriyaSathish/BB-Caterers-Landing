<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    ServerSignature Off

    # Render terminates HTTPS in front of the container
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Never serve private code, config, SQL or dot-files
    <DirectoryMatch "^/var/www/html/(config|core|database)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.|\.(sql|md|sh)$">
        Require all denied
    </FilesMatch>

    RewriteEngine On

    # /admin → /admin/
    RewriteRule ^/admin$ /admin/ [R=301,L]

    # Admin uploads kept in Neon (MEDIA_STORAGE=database) → media.php
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^/media/(uploads/.+)$ /media.php?p=$1 [L,QSA]

    # React app: any other unknown path is handled by index.html (client-side routing / 404 page)
    RewriteCond %{REQUEST_URI} !^/(api|admin|media)(/|$)
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.html [L]

    # Caching: hashed build files forever, images a week, the HTML shell never
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/media/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
